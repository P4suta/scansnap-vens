disallowed-types = [
  { path = "std::boxed::Box", reason = "Use concrete ownership or a reviewed item-scoped exception." },
  { path = "std::sync::Arc", reason = "Use concrete ownership or a reviewed item-scoped exception." },
  { path = "std::rc::Rc", reason = "Use concrete ownership or a reviewed item-scoped exception." },
  { path = "std::sync::Mutex", reason = "Pass owned state through explicit transitions." },
  { path = "std::sync::RwLock", reason = "Pass owned state through explicit transitions." },
