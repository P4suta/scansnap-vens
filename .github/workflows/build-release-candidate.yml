name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA in the history of protected main
        required: true
        type: string
      version:
        description: Product version in Cargo.toml without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.repository == 'P4suta/scansnap-vens' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
          - platform: macos-arm64
            runner: macos-15
            architecture: arm64
          - platform: windows-x86_64
            runner: windows-2025
            architecture: x86_64
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ matrix.platform }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Check the requested source and version
        shell: bash
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Use the full commit SHA from protected main"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use an X.Y.Z product version"
            exit 1
          fi
          if [[ "$(uname -m)" != "$ARCHITECTURE" ]]; then
            echo "::error::Expected a native $ARCHITECTURE runner"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the requested commit from main
        id: source
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"; then
            echo "::error::The requested commit is outside the history of protected main"
            exit 1
          fi
          git switch --detach "$SOURCE_SHA"
          if [[ "$PLATFORM" == windows-x86_64 && ! -f crates/windows-dns-sd/Cargo.toml ]]; then
            echo "::notice::The requested commit predates Windows distribution"
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.source.outputs.supported == 'true'
        with:
          version: "2026.11.9"
      - name: Check the locked versions and run the workspace checks
        if: steps.source.outputs.supported == 'true'
        shell: bash
        run: |
          for package in vens-cli vens-core vens-daemon vens-escl vens-net; do
            id="$(mise x -- cargo pkgid --locked --package "$package")"
            id="${id##*#}"
            if [[ "${id##*@}" != "$VERSION" ]]; then
              echo "::error::$package does not match the requested version $VERSION"
              exit 1
            fi
          done
          mise x -- just check
      - name: Build, archive, and exercise the commands
        if: matrix.platform != 'windows-x86_64'
        shell: bash
        run: |
          work=target/release-candidate
          bundle="scansnap-vens-${VERSION}-${PLATFORM}"
          mise x -- cargo build --locked --release --bins -p vens-cli -p vens-daemon --target-dir "$work/build"
          mkdir -p "$work/$bundle" "$work/assets" "$work/extracted"
          install -m 0755 "$work/build/release/vens" "$work/build/release/vensd" "$work/$bundle"
          install -m 0644 LICENSE-APACHE LICENSE-MIT "$work/$bundle"
          git rev-parse HEAD > "$work/$bundle/SOURCE_COMMIT"
          tar -czf "$work/assets/$bundle.tar.gz" -C "$work" "$bundle"
          tar -xzf "$work/assets/$bundle.tar.gz" -C "$work/extracted"
          test "$(<"$work/extracted/$bundle/SOURCE_COMMIT")" = "$SOURCE_SHA"
          "$work/extracted/$bundle/vens" --help
          "$work/extracted/$bundle/vensd" --help
          "$work/extracted/$bundle/vensd" avahi-service > "$work/avahi.service"
          test -s "$work/avahi.service"
      - name: Build, archive, and exercise the Windows commands
        if: matrix.platform == 'windows-x86_64' && steps.source.outputs.supported == 'true'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        shell: powershell
        run: |
          $work = 'target/release-candidate'
          $bundle = "scansnap-vens-${env:VERSION}-${env:PLATFORM}"
          $staged = "$work/$bundle"
          $archive = "$work/assets/$bundle.zip"
          mise x -- cargo build --locked --release --bins -p vens-cli -p vens-daemon --target-dir "$work/build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path $staged, "$work/assets" | Out-Null
          Copy-Item -LiteralPath "$work/build/release/vens.exe", "$work/build/release/vensd.exe", 'LICENSE-APACHE', 'LICENSE-MIT' -Destination $staged
          Set-Content -LiteralPath "$staged/SOURCE_COMMIT" -Value $env:SOURCE_SHA -Encoding ascii
          Compress-Archive -LiteralPath $staged -DestinationPath $archive
          Expand-Archive -LiteralPath $archive -DestinationPath "$work/extracted"
          $installed = "$work/extracted/$bundle"
          if ((Get-Content -LiteralPath "$installed/SOURCE_COMMIT") -cne $env:SOURCE_SHA) { throw 'Source commit mismatch.' }
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$visualStudio) { throw 'Visual C++ tools are unavailable.' }
          $toolset = (Get-Content -LiteralPath "$visualStudio/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $dumpbin = "$visualStudio/VC/Tools/MSVC/$toolset/bin/Hostx64/x64/dumpbin.exe"
          $payloads = @()
          foreach ($command in 'vens.exe', 'vensd.exe') {
            $executable = (Resolve-Path -LiteralPath "$installed/$command").Path
            $image = & $dumpbin /nologo /headers /dependents $executable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($image -match '^\s*8664\s+machine\b')) { throw "$command is not an x64 executable." }
            if ($image -match '^\s*(vcruntime|msvcp|msvcr|concrt|vcomp)\d+\S*\.dll\s*$') { throw "$command requires a Visual C++ Redistributable." }
            & $executable --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $digest = (Get-AppLockerFileInformation -Path $executable).Hash
            if ($digest.HashType -ne 'SHA256' -or $digest.HashDataString -notmatch '^0x[0-9a-fA-F]{64}$') { throw "Can't hash the signed content of $command." }
            $payloads += "$($digest.HashDataString.Substring(2).ToLowerInvariant())  $command"
          }
          $env:VENSD_UNDER_TEST = (Resolve-Path -LiteralPath "$installed/vensd.exe").Path
          mise x -- cargo test --locked -p vens-daemon --test windows_discovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $record = "$bundle.authenticode-sha256"
          $header = @("SOURCE_COMMIT $env:SOURCE_SHA", "UNSIGNED_ZIP_SHA256 $archiveHash")
          Set-Content -LiteralPath "$work/assets/$record" -Value ((($header + $payloads) -join "`n") + "`n") -Encoding ascii -NoNewline
          $recordHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$work/assets/$record").Hash.ToLowerInvariant()
          $sums = "$work/assets/SHA256SUMS.${env:PLATFORM}"
          Set-Content -LiteralPath $sums -Value "$archiveHash  $bundle.zip`n$recordHash  $record`n" -Encoding ascii -NoNewline
          $verified = foreach ($asset in "$bundle.zip", $record) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$work/assets/$asset").Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          if ((Get-Content -LiteralPath $sums -Raw) -cne (($verified -join "`n") + "`n")) { throw 'Artifact hash mismatch.' }
      - name: Archive the source and its locked dependency inventory
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          output=target/release-candidate/assets
          source="scansnap-vens-${VERSION}"
          git archive --format=tar.gz --prefix="$source/" --output="$output/$source.tar.gz" "$SOURCE_SHA"
          mise install github:anchore/syft@1.57.1
          mise x github:anchore/syft@1.57.1 -- syft scan dir:. \
            --override-default-catalogers rust-cargo-lock-cataloger \
            --exclude './target/**' \
            --source-name scansnap-vens --source-version "$VERSION" \
            --output "cyclonedx-json=$output/$source.cdx.json" --quiet
          jq -e --arg version "$VERSION" '
            .bomFormat == "CycloneDX" and
            .metadata.component.name == "scansnap-vens" and
            .metadata.component.version == $version and
            (.components | type == "array")
          ' "$output/$source.cdx.json"
          mise install aqua:mikefarah/yq@4.54.3
          mapfile -d '' lockfiles < <(git ls-files -z -- Cargo.lock '*/Cargo.lock')
          test "${#lockfiles[@]}" -gt 0
          mise x aqua:mikefarah/yq@4.54.3 -- yq eval-all -p=toml -o=yaml -N -r \
            '.package[] | [.name, .version] | @tsv' "${lockfiles[@]}" |
            LC_ALL=C sort -u > target/release-candidate/locked-packages.tsv
          jq -r '.components[] | select(.type != "file") | [.name, .version] | @tsv' "$output/$source.cdx.json" |
            LC_ALL=C sort -u > target/release-candidate/inventory-packages.tsv
          diff -u target/release-candidate/locked-packages.tsv target/release-candidate/inventory-packages.tsv
      - name: Record and verify archive hashes
        if: matrix.platform != 'windows-x86_64'
        working-directory: target/release-candidate/assets
        shell: bash
        run: |
          shasum -a 256 scansnap-vens-* > "SHA256SUMS.$PLATFORM"
          shasum -a 256 -c "SHA256SUMS.$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.source.outputs.supported == 'true'
        with:
          name: release-candidate-${{ matrix.platform }}
          path: target/release-candidate/assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest release candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Bind the attestation to the selected repository and commit.
      id-token: write # Request a signing certificate for this workflow.
      attestations: write # Store the build provenance in GitHub.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-candidate-*
          path: candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/*/scansnap-vens-*
            candidate/*/SHA256SUMS.*
